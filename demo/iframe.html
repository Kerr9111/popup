<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe popup content</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        place-items: center;
        background: #f4f7fb;
        color: #172033;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(520px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        line-height: 1.55;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@vecdev/message-bridge": "../node_modules/@vecdev/message-bridge/src/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Контент внутри iframe</h1>
      <p>Кнопка отправляет родительской странице событие закрытия через MessageBridge.</p>
      <button type="button" data-close>Закрыть</button>
    </main>
    <script type="module" src="./iframe.js"></script>
  </body>
</html>
